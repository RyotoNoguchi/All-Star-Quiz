name: Quiz quality
on:
  pull_request:
    paths: ["all-star-quiz/**", ".github/workflows/quiz-quality.yml"]
  push:
    branches: [main]
    paths: ["all-star-quiz/**", ".github/workflows/quiz-quality.yml"]
permissions:
  contents: read
concurrency:
  group: quiz-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: quiz
          POSTGRES_PASSWORD: quiz
          POSTGRES_DB: quiz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quiz -d quiz"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://quiz:quiz@localhost:5432/quiz
      DIRECT_URL: postgresql://quiz:quiz@localhost:5432/quiz
      TEST_DATABASE_URL: postgresql://quiz:quiz@localhost:5432/quiz
    defaults:
      run:
        working-directory: all-star-quiz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: all-star-quiz/.node-version
          cache: npm
          cache-dependency-path: all-star-quiz/package-lock.json
      - run: npm ci
      - run: npm run check
