name: Quiz quality
on:
  pull_request:
    paths: ["all-star-quiz/**", ".github/workflows/quiz-quality.yml"]
  push:
    branches: [main]
    paths: ["all-star-quiz/**", ".github/workflows/quiz-quality.yml"]
permissions:
  contents: read
concurrency:
  group: quiz-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: quiz
          POSTGRES_PASSWORD: quiz
          POSTGRES_DB: quiz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quiz -d quiz"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://quiz:quiz@localhost:5432/quiz
      DIRECT_URL: postgresql://quiz:quiz@localhost:5432/quiz
      TEST_DATABASE_URL: postgresql://quiz:quiz@localhost:5432/quiz
    defaults:
      run:
        working-directory: all-star-quiz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: all-star-quiz/.node-version
          cache: npm
          cache-dependency-path: all-star-quiz/package-lock.json
      - run: npm ci
      - run: npm run security:check
      - run: npm run check
      - run: docker build -t all-star-quiz-realtime:test .
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          QUIZ_E2E_IMAGE: all-star-quiz-realtime:test
      - run: npm run test:backup
        env:
          QUIZ_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: quiz-browser-test-results
          path: |
            all-star-quiz/playwright-report/
            all-star-quiz/test-results/
          retention-days: 7
