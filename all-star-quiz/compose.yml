name: all-star-quiz
services:
  redis:
    image: redis:7.4-alpine
    ports:
      - '127.0.0.1:56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 20
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: quiz
      POSTGRES_DB: quiz
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - quiz-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quiz -d quiz']
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  quiz-postgres:
